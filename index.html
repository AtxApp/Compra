<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La compra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f6b43">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>La compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: cotidiana, rápida, de bolsillo — una app que se usa con el carro en la mano
   IDEA: la libreta de la compra pegada en la nevera, con dos caras: la de casa y la tuya
   PICTURE: la propia lista limpia, agrupada por pasillos o tiendas; añadir vive en una hoja aparte
   COLOUR and TYPE: verde hoja de mercado como banda, blanco papel, tinta oscura, limón de acento; Outfit + Inter
   LAYOUT: una columna de 560px máx, cabecera con quién soy y pestañas, súper/otras, lista, botón flotante */
:root{color-scheme:light dark;
--bg:light-dark(#f6f7f4,#0f1512);--card:light-dark(#fff,#18201b);--ink:light-dark(#16211b,#e9efe9);
--mute:light-dark(#66736b,#93a198);--line:light-dark(#e2e7e1,#26312a);
--leaf:light-dark(#1f6b43,#1d5a3a);--leaft:light-dark(#1f6b43,#7fd0a3);--lemon:#f2c230;--tomato:light-dark(#c8432b,#ef7a62)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
header{background:var(--leaf);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px) 0}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:11px;box-shadow:0 2px 8px rgb(0 0 0/.25)}
.hi{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.hi button{border:1px solid rgb(255 255 255/.5);background:none;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
#login{position:fixed;inset:0;z-index:20;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top))}
#login[hidden]{display:none}
.lbox{width:min(360px,100%);text-align:center}
.lbox img{width:108px;height:108px;border-radius:26px;box-shadow:0 10px 30px rgb(0 0 0/.3)}
.lbox h1{margin:18px 0 6px}.lbox p{margin:0 0 20px;opacity:.85;font-size:15px}
.lbox input{width:100%;font-size:17px;padding:14px;border-radius:12px;border:0;margin-bottom:10px;background:#fff;color:#16211b}
.lbox .go{width:100%;border:0;border-radius:12px;background:var(--lemon);color:#16211b;font-weight:700;font-size:17px;min-height:52px}
.lbox .go:disabled{opacity:.6}
.lbox .err{color:#ffd9d2;font-size:14px;min-height:20px;margin:12px 0 0}
.lbox .lnk{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px;margin-top:8px;padding:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 34px/1.05 Outfit,sans-serif;margin:0;letter-spacing:-.01em}
.who{display:flex;background:rgb(0 0 0/.18);border-radius:999px;padding:4px}
.who button{border:0;background:none;color:#fff;padding:8px 14px;border-radius:999px;min-height:40px;font-weight:600;font-size:14px}
.who button[aria-pressed=true]{background:#fff;color:#16211b}
.sub{font-size:13px;opacity:.85;margin:6px 0 14px}
.sub button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:13px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:0;background:rgb(255 255 255/.14);color:#fff;padding:12px 10px;border-radius:14px 14px 0 0;font:700 16px Outfit,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.tabs svg{width:16px;height:16px;flex:none}
.count{font:600 12px Inter,sans-serif;background:var(--lemon);color:#16211b;border-radius:999px;padding:1px 8px}
main{padding:14px max(4vw,16px) 130px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;min-height:44px;font-weight:600;font-size:15px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0/.08)}
.seg svg{width:18px;height:18px;flex:none}
.seg .n{font-size:12px;color:var(--mute);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scrollchips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.scrollchips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;color:var(--ink);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.chip.add{border-style:dashed;color:var(--leaft);background:none}
.hint{font-size:13px;color:var(--mute);margin:10px 4px 0}
h2{font:700 13px Inter,sans-serif;color:var(--mute);margin:22px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
li{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 6px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
main li{animation:none}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){main li{animation:none}}
.box{width:48px;height:48px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0}
.box span{width:26px;height:26px;border:2px solid var(--mute);border-radius:8px;display:grid;place-items:center}
li.done .box span{background:var(--leaf);border-color:var(--leaf)}
.box svg{width:16px;height:16px;opacity:0}li.done .box svg{opacity:1}
.txt{flex:1;padding:8px 6px;border:0;background:none;text-align:left;border-radius:10px;min-height:48px}
.txt:hover{background:var(--bg)}
.name{font-weight:500;font-size:17px;overflow-wrap:anywhere;display:block}
li.done .name{text-decoration:line-through;color:var(--mute)}
.meta{font-size:13px;color:var(--mute);display:block;overflow-wrap:anywhere}
.qty{font-weight:600;color:var(--tomato);margin-right:6px;white-space:nowrap}
.del{width:44px;height:44px;border:0;background:none;color:var(--mute);border-radius:10px;flex:none}
.del:hover{color:var(--tomato)}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.empty svg{width:120px;height:90px;display:block;margin:0 auto 10px}
.link{background:none;border:0;color:var(--tomato);font-size:13px;font-weight:600;padding:6px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;border:0;background:var(--leaf);color:#fff;border-radius:999px;padding:0 22px 0 18px;min-height:58px;font:700 18px Outfit,sans-serif;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgb(20 60 40/.35)}
.fab svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgb(0 0 0/.25);max-width:calc(100% - 32px);z-index:5}
.toast[hidden]{display:none}
.toast button{border:0;background:var(--lemon);color:#16211b;border-radius:10px;padding:8px 12px;font-weight:600;min-height:40px}
.toast button[hidden]{display:none}
.proto{font-size:13px;color:var(--mute);text-align:center;margin-top:28px}
dialog{border:0;border-radius:20px;padding:20px;background:var(--card);color:var(--ink);width:min(420px,94vw);max-height:90vh}
dialog::backdrop{background:rgb(0 0 0/.45)}
dialog h3{font:700 22px Outfit,sans-serif;margin:0}
dialog label,.lab{display:block;font-size:13px;color:var(--mute);margin-top:14px}
dialog input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
.two{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
dialog .chips,dialog .seg{margin-top:6px}
.newshop{display:flex;gap:8px;margin-top:8px}
.newshop input{margin:0}
.newshop button{border:0;border-radius:10px;background:var(--leaf);color:#fff;padding:0 14px;font-weight:600;min-height:44px}
.act{display:flex;gap:8px;margin-top:20px;align-items:center}
.act .sp{flex:1}
.act button{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600}
.pri{background:var(--leaf);color:#fff}.pri:disabled{opacity:.45}.sec{background:var(--line)}.dan{background:none!important;color:var(--tomato);padding-inline:4px!important}
/* hoja de añadir */
#sheet{padding:0;width:min(480px,96vw);height:min(760px,92vh);overflow:hidden}
#sheet[open]{display:flex;flex-direction:column}
.shead{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.shead .top{flex-wrap:nowrap}
.shead p{margin:2px 0 10px;font-size:13px;color:var(--mute)}
.x{border:0;background:var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.search{display:flex;gap:8px}
.search input{flex:1;margin:0;font-size:17px;padding:12px}
.flash{font-size:13px;color:var(--leaft);font-weight:600;min-height:20px;margin:6px 2px 0}
.sbody{flex:1;overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.newrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:2px dashed var(--leaft);color:var(--leaft);background:none;border-radius:14px;padding:12px 14px;text-align:left;min-height:56px}
.newrow svg{width:22px;height:22px;flex:none}
.newrow b{color:var(--ink)}
.newrow small{display:block;color:var(--mute);font-size:13px}
.sbody li.on .box span{background:var(--lemon);border-color:var(--lemon)}
.sbody li.on .box svg{opacity:1}.sbody li.on .box svg path{stroke:#16211b}
.sbody li.has{opacity:.55}
.tag{font-size:12px;color:var(--leaft);font-weight:600;white-space:nowrap;padding-right:8px}
.sfoot{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot button{border:0;border-radius:12px;min-height:50px;padding:0 16px;font-weight:600}
.sfoot .pri{flex:1}
.mini{border:0;background:none;color:var(--mute);font-size:13px;font-weight:600;padding:6px 4px;min-height:36px}
/* interruptor */
.sw{display:flex!important;align-items:center;gap:10px;margin-top:10px!important;font-size:14px!important;color:var(--ink)!important;cursor:pointer;min-height:36px}
.sw input{appearance:none;-webkit-appearance:none;width:44px!important;height:26px;border-radius:999px;background:var(--line);border:0!important;padding:0!important;margin:0!important;position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:transform .15s}
.sw input:checked{background:var(--leaf)}.sw input:checked::after{transform:translateX(18px)}
.sw svg{width:16px;height:16px;color:var(--lemon);flex:none}
/* recetas */
.recs{display:grid;gap:10px;margin-top:14px}
.rcard{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;min-height:72px}
.rcard .ic{width:44px;height:44px;border-radius:12px;background:light-dark(#fdf3d0,#3a3214);display:grid;place-items:center;flex:none;color:light-dark(#9a6d00,#f2c230)}
.rcard .ic svg{width:24px;height:24px}
.rcard b{font:700 18px Outfit,sans-serif;display:block}
.rcard small{color:var(--mute);font-size:13px;display:block;overflow-wrap:anywhere}
.rcard .go{margin-left:auto;color:var(--mute);flex:none}
#rec{padding:0;width:min(480px,96vw);height:min(760px,92vh);overflow:hidden}
#rec[open]{display:flex;flex-direction:column}
.rname{font:700 22px Outfit,sans-serif!important;border:0!important;background:none!important;padding:4px 0!important;margin:0!important}
.rsend{padding:10px 14px 0;border-top:1px solid var(--line)}
.rsend .lab{margin:0 0 6px}
</style>
</head>
<body>
<div id="login">
  <form class="lbox" id="lform" autocomplete="on">
    <img src="icon.svg" alt="">
    <h1>La compra</h1>
    <p id="lsub">Entra con tu cuenta para ver vuestras listas.</p>
    <input id="lemail" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lpass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="go" id="lgo">Entrar</button>
    <p class="err" id="lerr" role="alert"></p>
    <button type="button" class="lnk" id="lforgot">He olvidado la contraseña</button>
  </form>
</div>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><img src="icon.svg" alt=""><h1>La compra</h1></div>
      <div class="hi"><span id="hello"></span><button id="logout">Salir</button></div>
    </div>
    <p class="sub" id="status"></p>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-shared" aria-selected="true">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="5" r="2.6"/><circle cx="11" cy="5.5" r="2.2"/><path d="M1 14c0-3 2-4.6 4.5-4.6S10 11 10 14z"/><path d="M10.6 9.4c2.4 0 4.4 1.4 4.4 4.6h-4c0-2-.4-3.4-1.4-4.4z"/></svg>
        Compartida <span class="count" id="c-shared">0</span></button>
      <button role="tab" id="t-mine" aria-selected="false">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7zm2 0h4V5a2 2 0 0 0-4 0z"/></svg>
        Solo mía <span class="count" id="c-mine">0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="seg" id="store" role="group" aria-label="Tipo de lista"></div>
  <div class="scrollchips" id="shopfilter" role="group" aria-label="Filtrar por tienda"></div>
  <p class="hint" id="hint"></p>
  <div id="list"></div>
</main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fablbl">Añadir</span></button>
<div class="toast" id="toast" hidden role="status"><span id="tmsg"></span><button id="undo">Deshacer</button></div>

<dialog id="sheet">
  <div class="shead">
    <div class="top"><h3 id="stitle">Añadir</h3><button type="button" class="x" id="sclose" aria-label="Cerrar"><svg viewBox="0 0 16 16" width="14" height="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
    <p id="ssub"></p>
    <form class="search" id="sform" autocomplete="off"><input id="sq" type="search" enterkeyhint="done" aria-label="Buscar o añadir"></form>
    <label class="sw"><input type="checkbox" id="susual"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2.5l2.3 4.7 5.2.8-3.8 3.6.9 5.2L10 14.4l-4.6 2.4.9-5.2L2.5 8l5.2-.8z"/></svg>Guardar lo nuevo en habituales</label>
    <div id="sshopwrap"><span class="lab" id="sshoplab">Tienda para lo nuevo</span><div class="scrollchips" id="sshops" style="padding-top:6px"></div><div id="sshopnew"></div></div>
    <div class="flash" id="flash" aria-live="polite"></div>
  </div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot">
    <button type="button" class="mini" id="sedit">Editar habituales</button>
    <button type="button" class="pri" id="sadd">Listo</button>
  </div>
</dialog>

<dialog id="rec">
  <div class="shead">
    <div class="top"><input id="r-name" class="rname" aria-label="Nombre de la receta" maxlength="40"><button type="button" class="x" id="r-close" autofocus aria-label="Cerrar"><svg viewBox="0 0 16 16" width="14" height="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
    <p>Solo la ves tú. Marca lo que te falta y mándalo a la compra.</p>
    <form class="search" id="r-add" autocomplete="off"><input id="r-in" type="text" enterkeyhint="done" placeholder="Añadir ingrediente… ej. 500 g carne picada" aria-label="Añadir ingrediente"></form>
  </div>
  <div class="sbody" id="r-body"></div>
  <div class="rsend"><span class="lab">Enviar a</span><div class="seg" id="r-target"></div></div>
  <div class="sfoot">
    <button type="button" class="mini" id="r-del" style="color:var(--tomato)">Borrar receta</button>
    <button type="button" class="pri" id="r-go">Añadir</button>
  </div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="dform">
    <h3>Nombres</h3>
    <label>Tú<input id="n0" maxlength="14"></label>
    <label>Tu pareja<input id="n1" maxlength="14"></label>
    <div class="act"><span class="sp"></span><button class="sec" value="cancel">Cancelar</button><button class="pri" value="ok">Guardar</button></div>
  </form>
</dialog>

<dialog id="ed">
  <form method="dialog" id="eform" autocomplete="off">
    <h3>Editar</h3>
    <div class="two">
      <label>Cantidad<input id="e-qty" placeholder="2, 1 kg…"></label>
      <label>Nombre<input id="e-text" required></label>
    </div>
    <label>Nota<input id="e-note" placeholder="Talla M, la marca de siempre…"></label>
    <span class="lab">Lista</span>
    <div class="seg" id="e-store"></div>
    <div id="e-shopwrap"><span class="lab">Tienda</span><div class="chips" id="e-shops"></div><div id="e-shopnew"></div></div>
    <span class="lab">Categoría</span>
    <div class="chips" id="e-cats"></div>
    <span class="lab">Quién lo ve</span>
    <div class="seg" id="e-list"></div>
    <label class="sw"><input type="checkbox" id="e-usual"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2.5l2.3 4.7 5.2.8-3.8 3.6.9 5.2L10 14.4l-4.6 2.4.9-5.2L2.5 8l5.2-.8z"/></svg>Guardar en habituales</label>
    <div class="act">
      <button type="button" class="dan" id="e-del">Borrar</button><span class="sp"></span>
      <button class="sec" value="cancel" formnovalidate>Cancelar</button><button class="pri" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<script type="module">
import {firebaseConfig,MEMBERS} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,doc,collection,onSnapshot,writeBatch,setDoc} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
{
const R=s=>new RegExp(s,'i');
const STORES={
 super:{label:'Súper',cats:[
  ['fruta','Fruta y verdura',R('manzan|plátan|platan|naranj|limón|limon|tomat|lechug|cebol|ajo|patat|zanahor|pimient|fres|uva|pera|aguacat|calabac|espinac|pepino|melón|melon|sandía|kiwi|verdur|fruta')],
  ['frescos','Carne, pescado y frescos',R('pollo|carne|ternera|cerdo|jamón|jamon|pescado|salmón|salmon|merluza|huevo|chorizo|pavo|gamba|lomo|fiambre')],
  ['lacteos','Lácteos',R('leche|yogur|queso|mantequill|nata|kéfir|kefir')],
  ['despensa','Despensa',R('arroz|pasta|macarr|espagu|aceite|azúcar|azucar|harina|lenteja|garbanz|atún|atun|café|cafe|cacao|galleta|cereal|\\bpan\\b|legumbre|conserva|especia|vinagre|chocolate')],
  ['bebida','Bebidas',R('agua|cerveza|vino|zumo|refresco|coca')],

const catOk=(s,c)=>catsOf(s).some(x=>x[0]===c)?c:'otros';

if(configured){
  app=initializeApp(firebaseConfig);auth=getAuth(app);

  catch(e){db=initializeFirestore(app,{ignoreUndefinedProperties:true})}

const synced=new Map();let syncedShops=null;
const clean=o=>JSON.parse(JSON.stringify(o));
const pathOf=(kind,o)=>`${kind==='recipes'||o.list!=='shared'?`users/${uid}`:'shared/main'}/${kind}/${o.id}`;
/* Guarda: compara el estado local con lo último sincronizado y escribe solo lo que ha cambiado */
function save(){
  savePrefs();if(!ready)return;
  const want=new Map();
  for(const i of S.items)if(i.list==='shared'||i.list===S.me)want.set(pathOf('items',i),i);
  for(const u of S.usual)if(u.list==='shared'||u.list===S.me)want.set(pathOf('usual',u),u);
  for(const r of S.recipes)if(r.owner===S.me)want.set(pathOf('recipes',r),r);
  const b=writeBatch(db);let n=0;
  for(const [p,o] of want){const j=JSON.stringify(o);if(synced.get(p)!==j){b.set(doc(db,p),clean(o));synced.set(p,j);n++}}
  for(const p of [...synced.keys()])if(!want.has(p)){b.delete(doc(db,p));synced.delete(p);n++}
  const sj=JSON.stringify(S.shops);
  if(syncedShops!==null&&sj!==syncedShops){b.set(doc(db,'shared/main'),{shops:S.shops},{merge:true});syncedShops=sj;n++}
  if(n)b.commit().catch(err=>toast('No se pudo guardar ('+(err.code||err.message)+')',null));
}
const parts={},loaded=new Set();
function rebuild(){
  const P=k=>[...(parts[`shared/main/${k}`]||[]),...(parts[`users/${uid}/${k}`]||[])].sort((a,b)=>a.id-b.id);
  S.items=P('items');S.usual=P('usual');S.recipes=(parts[`users/${uid}/recipes`]||[]).sort((a,b)=>a.id-b.id);
}
function refresh(){
  render();
  if($('sheet').open)drawSheet();
  if($('rec').open)drawRecipe();
}
function listen(path,fix){
  unsubs.push(onSnapshot(collection(db,path),snap=>{
    const arr=[];snap.forEach(d=>{const o=d.data();fix(o);arr.push(o)});
    for(const p of [...synced.keys()])if(p.startsWith(path+'/'))synced.delete(p);
    for(const o of arr)synced.set(`${path}/${o.id}`,JSON.stringify(o));
    parts[path]=arr;loaded.add(path);rebuild();
    if(loaded.size>=6)ready=true;
    refresh();
  },err=>toast('Error de conexión ('+err.code+')',null)));
}
function start(){
  const shared=o=>{o.list='shared'},mine=o=>{if(o.list!=='shared')o.list=S.me},own=o=>{o.owner=S.me};
  listen('shared/main/items',shared);listen(`users/${uid}/items`,mine);
  listen('shared/main/usual',shared);listen(`users/${uid}/usual`,mine);
  listen(`users/${uid}/recipes`,own);
  unsubs.push(onSnapshot(doc(db,'shared/main'),d=>{
    if(!d.exists()||!Array.isArray(d.data().shops)){S.shops=[...DEFAULT_SHOPS];setDoc(doc(db,'shared/main'),{shops:S.shops},{merge:true}).catch(()=>{})}
    else S.shops=d.data().shops;
    syncedShops=JSON.stringify(S.shops);loaded.add('shops');
    if(loaded.size>=6)ready=true;
    refresh();
  },err=>toast('Error de conexión ('+err.code+')',null)));
}
function stop(){unsubs.forEach(u=>u());unsubs=[];ready=false;loaded.clear();synced.clear();for(const k in parts)delete parts[k];S.items=[];S.usual=[];S.recipes=[]}

/* ---------- habituales ---------- */
const ukey=(o)=>`${o.list}|${o.store}|${o.text.trim().toLowerCase()}`;
function remember(it,{bought=false,create=false}={}){
  let u=S.usual.find(u=>ukey(u)===ukey(it));
  if(!u&&!create)return;
  if(!u){u={id:nid(),text:it.text,qty:it.qty||'',note:it.note||'',cat:it.cat,store:it.store,shop:it.shop||'',list:it.list,n:0};S.usual.push(u)}
  else{u.cat=it.cat;u.shop=it.shop||'';if(it.qty)u.qty=it.qty;if(it.note)u.note=it.note}
  if(bought)u.n++;
}

/* agrupar: súper por pasillo, otras cosas por tienda */
function groups(arr,store){
  if(store==='super')return catsOf('super').map(([k,l])=>[l,arr.filter(i=>catOk('super',i.cat)===k),false]).filter(g=>g[1].length);
  const names=shopOrder([...new Set(arr.map(shopName))]);
  return names.map(n=>[n,arr.filter(i=>shopName(i)===n),true]);
}

function row(i){
  const bits=[];
  if(i.store==='otras')bits.push(catLabel('otras',i.cat));
  if(i.from)bits.push(`Para ${esc(i.from)}`);
  if(i.note)bits.push(esc(i.note));
  if(S.tab==='shared')bits.push(`Lo añadió ${i.by===S.me?'tú':esc(S.names[i.by])}`);
  return `<li class="${i.done?'done':''}" data-id="${i.id}">
   <button class="box" data-a="tog" aria-label="${i.done?'Desmarcar':'Marcar'} ${esc(i.text)}"><span>${check}</span></button>
   <button class="txt" data-a="edit" aria-label="Editar ${esc(i.text)}"><span class="name">${i.qty?`<span class="qty">${esc(i.qty)}</span>`:''}${esc(i.text)}</span><span class="meta">${bits.join(' · ')}</span></button>
   <button class="del" data-a="del" aria-label="Borrar ${esc(i.text)}">${trash}</button></li>`;
}

function render(){
  $('hello').textContent=uid?`Hola, ${S.names[S.me]}`:'';
  $('status').textContent=navigator.onLine?(S.tab==='shared'?`Compartida con ${S.names[1-S.me]}.`:'Solo tú ves esta lista.'):'Sin conexión: los cambios se guardan y se enviarán al volver.';
  $('t-shared').setAttribute('aria-selected',S.tab==='shared');
  $('t-mine').setAttribute('aria-selected',S.tab==='mine');
  $('c-shared').textContent=pending('shared');
  $('c-mine').textContent=pending(S.me);
  const lk=listKey();
  const segs=[['super',`${icoCart}Súper <span class="n">${pending(lk,'super')}</span>`],['otras',`${icoBag}${S.tab==='mine'?'Otras':'Otras cosas'} <span class="n">${pending(lk,'otras')}</span>`]];
  if(S.tab==='mine')segs.push(['recetas',`${icoBook}Recetas <span class="n">${myRecipes().length}</span>`]);
  $('store').innerHTML=segHTML(segs,S.store,'store');
  $('fablbl').textContent=S.store==='recetas'?'Nueva receta':'Añadir';
  if(S.store==='recetas'){$('shopfilter').hidden=true;renderRecipes();return}
  let items=S.items.filter(inView);
  // filtro por tienda (solo otras cosas)
  const sf=$('shopfilter');
  if(S.store==='otras'){
    const todoAll=items.filter(i=>!i.done);
    const names=shopOrder([...new Set(todoAll.map(shopName))]);
    if(S.shopFilter&&!names.includes(S.shopFilter))S.shopFilter='';
    sf.hidden=names.length<2;
    sf.innerHTML=`<button class="chip" data-sf="" aria-pressed="${!S.shopFilter}">Todas</button>`+names.map(n=>`<button class="chip" data-sf="${esc(n)}" aria-pressed="${S.shopFilter===n}">${esc(n)}<span class="n">${todoAll.filter(i=>shopName(i)===n).length}</span></button>`).join('');
    if(S.shopFilter)items=items.filter(i=>shopName(i)===S.shopFilter);
  }else sf.hidden=true;
  $('hint').textContent=(S.tab==='shared'?`Lo ve ${S.names[1-S.me]} también.`:`Solo lo ves tú.`)+' Toca un producto para editarlo.';
  const todo=items.filter(i=>!i.done),done=items.filter(i=>i.done);
  let h='';
  if(!items.length)h=`<div class="empty">${basket}<div>Nada por aquí todavía.<br>Pulsa «Añadir» para empezar.</div></div>`;
  for(const [label,g,isShop] of groups(todo,S.store))h+=`<h2><span>${isShop?icoShop:''}${esc(label)}</span><span>${g.length}</span></h2><ul>${g.map(row).join('')}</ul>`;
  if(todo.length===0&&done.length)h+=`<div class="empty">${basket}<div>¡Todo comprado!</div></div>`;
  if(done.length)h+=`<h2>Comprado (${done.length})<button class="link" data-a="clear">Quitar comprados</button></h2><ul>${done.map(row).join('')}</ul>`;
  $('list').innerHTML=h;
}

function toast(msg,undo){
  last=undo;$('tmsg').textContent=msg;$('undo').hidden=!undo;$('toast').hidden=false;
  clearTimeout(tt);tt=setTimeout(()=>{$('toast').hidden=true;last=null},5000);

function parse(t){
  let qty='';const m=t.match(/^(\d+[.,]?\d*\s*(kg|g|l|ml|uds?|paquetes?|latas?|botellas?)?)\s+(.+)/i);
  if(m){qty=m[1];t=m[3]}
  return {qty,text:t.charAt(0).toUpperCase()+t.slice(1)};
}
const openDlg=d=>{try{d.showModal()}catch(e){d.setAttribute('open','')}};

/* ---------- selector de tienda (hoja y editor) ---------- */
function shopPicker(wrapId,newId,cur,adding,attr){
  $(wrapId).innerHTML=[['',NOSHOP],...S.shops.map(s=>[s,s])].map(([v,l])=>`<button type="button" class="chip" data-${attr}="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join('')+`<button type="button" class="chip add" data-${attr}new="1">+ Nueva tienda</button>`;
  $(newId).innerHTML=adding?`<div class="newshop"><input id="${newId}-in" placeholder="Nombre de la tienda" maxlength="24"><button type="button" data-${attr}ok="1">Crear</button></div>`:'';
  if(adding)setTimeout(()=>$(newId+'-in')?.focus(),30);
}
function addShop(name){
  name=name.trim();if(!name)return '';
  const ex=S.shops.find(s=>s.toLowerCase()===name.toLowerCase());
  if(ex)return ex;S.shops.push(name);save();return name;
}

/* ---------- hoja de añadir ---------- */
const A={sel:new Set(),shop:'',addingShop:false,editing:false,added:0};
function openSheet(){
  A.sel=new Set();A.addingShop=false;A.editing=false;A.added=0;
  A.shop=S.store==='otras'&&S.shopFilter&&S.shopFilter!==NOSHOP?S.shopFilter:'';
  $('sq').value='';$('flash').textContent='';$('susual').checked=S.saveUsual;

}
function drawSheet(){
  const store=S.store,q=$('sq').value.trim();
  $('stitle').textContent=`Añadir a ${STORES[store].label}`;
  $('ssub').textContent=(S.tab==='shared'?'Lista compartida':'Tu lista personal')+'. Elige de tus habituales o escribe algo nuevo.';
  $('sq').placeholder=store==='super'?'Buscar o añadir… ej. 2 leche':'Buscar o añadir… ej. bombillas';
  $('sshopwrap').hidden=store!=='otras';
  if(store==='otras')shopPicker('sshops','sshopnew',A.shop,A.addingShop,'ss');
  const p=q?parse(q):null,ql=p?p.text.toLowerCase():'';
  const all=usualHere().filter(u=>!ql||u.text.toLowerCase().includes(ql));
  const exact=p&&usualHere().find(u=>u.text.toLowerCase()===ql);
  let h='';
  if(p&&!exact){
    const cat=catLabel(store,guess(store,p.text));
    h+=`<button type="button" class="newrow" data-s="new">${icoPlus}<span>Añadir <b>«${esc((p.qty?p.qty+' ':'')+p.text)}»</b><small>Nuevo · ${esc(cat)}${store==='otras'?' · '+esc(A.shop||NOSHOP):''} · ${S.saveUsual?'se guardará en habituales':'solo esta vez'}</small></span></button>`;
  }
  if(!all.length&&!p)h+=`<div class="empty">Aún no hay habituales aquí.<br>Escribe arriba para añadir lo primero.</div>`;
  for(const [label,g,isShop] of groups(all,store)){
    g.sort((a,b)=>b.n-a.n||a.text.localeCompare(b.text));
    h+=`<h2><span>${isShop?icoShop:''}${esc(label)}</span><span>${g.length}</span></h2><ul>`+g.map(u=>{
      const has=onList(u),on=A.sel.has(u.id);
      const meta=[store==='otras'&&catLabel('otras',u.cat),u.note&&esc(u.note),u.n?`${u.n} ${u.n===1?'vez':'veces'}`:''].filter(Boolean).join(' · ');
      return `<li class="${on?'on':''} ${has?'has':''}" data-u="${u.id}">
        <button class="box" data-s="sel" ${has?'disabled':''} aria-label="Seleccionar ${esc(u.text)}"><span>${check}</span></button>
        <button class="txt" data-s="sel" ${has?'disabled':''}><span class="name">${u.qty?`<span class="qty">${esc(u.qty)}</span>`:''}${esc(u.text)}</span>${meta?`<span class="meta">${meta}</span>`:''}</button>
        ${A.editing?`<button class="del" data-s="rm" aria-label="Quitar ${esc(u.text)} de habituales">${trash}</button>`:has?'<span class="tag">En la lista</span>':''}</li>`}).join('')+'</ul>';
  }
  $('sbody').innerHTML=h;
  $('sedit').textContent=A.editing?'Hecho':'Editar habituales';
  $('sadd').textContent=A.sel.size?`Añadir ${A.sel.size} a la lista`:'Listo';
}
function addNew(){
  const q=$('sq').value.trim();if(!q)return;
  const p=parse(q),store=S.store;
  const exact=usualHere().find(u=>u.text.toLowerCase()===p.text.toLowerCase());
  let it;
  if(exact){
    if(onList(exact)){$('flash').textContent=`«${exact.text}» ya está en la lista`;$('sq').value='';drawSheet();return}
    it={id:nid(),text:exact.text,qty:p.qty||exact.qty,note:exact.note,cat:exact.cat,store,shop:exact.shop||'',list:listKey(),by:S.me,done:false};
  }else{
    it={id:nid(),text:p.text,qty:p.qty,note:'',cat:guess(store,p.text),store,shop:store==='otras'?A.shop:'',list:listKey(),by:S.me,done:false};
  }
  S.items.push(it);remember(it,{create:S.saveUsual});A.added++;save();render();
  $('flash').textContent=`✓ «${it.text}» añadido`;
  $('sq').value='';drawSheet();$('sq').focus();
}
$('fab').addEventListener('click',()=>S.store==='recetas'?newRecipe():openSheet());
$('sq').addEventListener('input',drawSheet);
$('susual').addEventListener('change',e=>{S.saveUsual=e.target.checked;save();drawSheet()});
$('sform').addEventListener('submit',e=>{e.preventDefault();addNew()});
$('sclose').addEventListener('click',()=>$('sheet').close());
$('sedit').addEventListener('click',()=>{A.editing=!A.editing;drawSheet()});
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.ss!==undefined){A.shop=b.dataset.ss;A.addingShop=false;drawSheet();return}
  if(b.dataset.ssnew){A.addingShop=!A.addingShop;drawSheet();return}
  if(b.dataset.ssok){A.shop=addShop($('sshopnew-in').value);A.addingShop=false;drawSheet();return}
  const s=b.dataset.s;if(!s)return;
  if(s==='new'){addNew();return}
  const id=+b.closest('li').dataset.u;
  if(s==='sel'){A.sel.has(id)?A.sel.delete(id):A.sel.add(id)}
  if(s==='rm'){S.usual=S.usual.filter(u=>u.id!==id);A.sel.delete(id);save();render()}
  drawSheet();
});
$('sheet').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sshopnew-in'){e.preventDefault();A.shop=addShop(e.target.value);A.addingShop=false;drawSheet()}});
$('sadd').addEventListener('click',()=>{
  const picked=S.usual.filter(u=>A.sel.has(u.id));
  let t=nid();
  const added=picked.map(u=>({id:t++,text:u.text,qty:u.qty,note:u.note,cat:u.cat,store:u.store,shop:u.shop||'',list:u.list,by:S.me,done:false}));
  S.items.push(...added);save();render();$('sheet').close();
  const n=added.length+A.added;
  if(added.length)toast(`${n} añadidos a la lista`,()=>{const ids=new Set(added.map(a=>a.id));S.items=S.items.filter(i=>!ids.has(i.id))});
  else if(n)toast(`${n} añadidos a la lista`,null);
});

/* ---------- recetas (privadas de cada uno) ---------- */
const myRecipes=()=>S.recipes.filter(r=>r.owner===S.me);
const Rc={id:null,sel:new Set(),target:'shared'};
const curRec=()=>S.recipes.find(r=>r.id===Rc.id);
const onTarget=(text,target)=>S.items.some(i=>!i.done&&i.store==='super'&&i.list===target&&i.text.toLowerCase()===text.toLowerCase());
function renderRecipes(){
  $('hint').textContent='Recetas y grupos de productos que guardas para cuando los necesites. Solo los ves tú.';
  const rs=myRecipes();
  $('list').innerHTML=rs.length?`<div class="recs">${rs.map(r=>{
    const miss=r.items.filter(x=>!onTarget(x.text,'shared')).length;
    return `<button class="rcard" data-r="${r.id}"><span class="ic">${icoPan}</span><span><b>${esc(r.name)}</b><small>${r.items.length} productos · ${esc(r.items.slice(0,3).map(x=>x.text).join(', '))}${r.items.length>3?'…':''}</small></span><span class="go">${chev}</span></button>`}).join('')}</div>`
   :`<div class="empty">${basket}<div>Aún no tienes recetas.<br>Pulsa «Nueva receta» para guardar la primera.</div></div>`;
}
function openRecipe(id,focusName){
  Rc.id=id;Rc.target='shared';const r=curRec();
  Rc.sel=new Set(r.items.filter(x=>!onTarget(x.text,Rc.target)).map(x=>x.id));
  $('r-name').value=r.name;$('r-in').value='';
  drawRecipe();openDlg($('rec'));
  if(focusName)setTimeout(()=>{$('r-name').focus();$('r-name').select()},50);
}
function newRecipe(){
  const r={id:nid(),owner:S.me,name:'Nueva receta',items:[]};
  S.recipes.push(r);save();render();openRecipe(r.id,true);
}
function drawRecipe(){
  const r=curRec();if(!r)return;
  $('r-target').innerHTML=segHTML([['shared','Lista compartida'],['mine','Mi lista']],Rc.target,'rt');
  const tgt=Rc.target==='shared'?'shared':S.me;
  $('r-body').innerHTML=r.items.length?`<h2><span>Productos</span><button class="link" data-rx="all" style="color:var(--leaft)">${Rc.sel.size===r.items.length?'Ninguno':'Todos'}</button></h2><ul>`+r.items.map(x=>{
    const has=onTarget(x.text,tgt),on=Rc.sel.has(x.id);
    return `<li class="${on?'on':''}" data-x="${x.id}">
      <button class="box" data-rx="sel" aria-label="Seleccionar ${esc(x.text)}"><span>${check}</span></button>
      <button class="txt" data-rx="sel"><span class="name">${x.qty?`<span class="qty">${esc(x.qty)}</span>`:''}${esc(x.text)}</span><span class="meta">${catLabel('super',x.cat)}${has?' · ya está en esa lista':''}</span></button>
      <button class="del" data-rx="rm" aria-label="Quitar ${esc(x.text)}">${trash}</button></li>`}).join('')+'</ul>'
   :`<div class="empty">Añade arriba los productos de esta receta.</div>`;
  $('r-go').disabled=!Rc.sel.size;
  $('r-go').textContent=Rc.sel.size?`Añadir ${Rc.sel.size} a la compra`:'Marca lo que te falta';
}
$('r-name').addEventListener('input',e=>{const r=curRec();if(r){r.name=e.target.value.trim()||'Sin nombre';save();render()}});
$('r-close').addEventListener('click',()=>$('rec').close());
$('r-add').addEventListener('submit',e=>{
  e.preventDefault();const q=$('r-in').value.trim();if(!q)return;
  const p=parse(q),r=curRec(),x={id:nid(),text:p.text,qty:p.qty,cat:guess('super',p.text)};
  r.items.push(x);if(!onTarget(x.text,Rc.target==='shared'?'shared':S.me))Rc.sel.add(x.id);$('r-in').value='';save();render();drawRecipe();
});
$('rec').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const r=curRec();
  if(b.dataset.rt){Rc.target=b.dataset.rt;const tgt=Rc.target==='shared'?'shared':S.me;Rc.sel=new Set(r.items.filter(x=>!onTarget(x.text,tgt)).map(x=>x.id));drawRecipe();return}
  const a=b.dataset.rx;if(!a)return;
  if(a==='all'){Rc.sel=Rc.sel.size===r.items.length?new Set():new Set(r.items.map(x=>x.id));drawRecipe();return}
  const id=+b.closest('li').dataset.x;
  if(a==='sel'){Rc.sel.has(id)?Rc.sel.delete(id):Rc.sel.add(id)}
  if(a==='rm'){r.items=r.items.filter(x=>x.id!==id);Rc.sel.delete(id);save();render()}
  drawRecipe();
});
$('r-go').addEventListener('click',()=>{
  const r=curRec(),tgt=Rc.target==='shared'?'shared':S.me;let t=nid();
  const added=r.items.filter(x=>Rc.sel.has(x.id)&&!onTarget(x.text,tgt)).map(x=>({id:t++,text:x.text,qty:x.qty,note:'',cat:x.cat,store:'super',shop:'',list:tgt,by:S.me,done:false,from:r.name}));
  S.items.push(...added);save();render();$('rec').close();
  toast(added.length?`${added.length} de «${r.name}» → ${Rc.target==='shared'?'compartida':'tu lista'}`:'Ya estaba todo en la lista',added.length?()=>{const ids=new Set(added.map(a=>a.id));S.items=S.items.filter(i=>!ids.has(i.id))}:null);
});
$('r-del').addEventListener('click',()=>{
  const ix=S.recipes.findIndex(r=>r.id===Rc.id);if(ix<0)return;
  const r=S.recipes.splice(ix,1)[0];$('rec').close();save();render();
  toast(`Receta «${r.name}» borrada`,()=>S.recipes.splice(ix,0,r));
});

/* ---------- editor ---------- */
function drawEditor(){
  $('e-store').innerHTML=segHTML([['super',`${icoCart}Súper`],['otras',`${icoBag}Otras cosas`]],edit.store,'es');
  $('e-shopwrap').hidden=edit.store!=='otras';
  if(edit.store==='otras')shopPicker('e-shops','e-shopnew',edit.shop,edit.addingShop,'esh');
  $('e-cats').innerHTML=chipsHTML(edit.store,edit.cat,'ec');
  $('e-list').innerHTML=segHTML([['shared','Compartida'],[String(S.me),'Solo yo']],edit.list,'el');
}
function openEditor(it){
  edit={id:it.id,store:it.store,cat:it.cat,list:it.list,shop:it.shop||'',addingShop:false};
  $('e-text').value=it.text;$('e-qty').value=it.qty||'';$('e-note').value=it.note||'';
  $('e-usual').checked=S.usual.some(u=>ukey(u)===ukey(it));
  drawEditor();openDlg($('ed'));
}
$('ed').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!edit)return;
  if(b.dataset.es){if(edit.store!==b.dataset.es){edit.store=b.dataset.es;edit.cat=guess(edit.store,$('e-text').value)}drawEditor()}
  else if(b.dataset.ec){edit.cat=b.dataset.ec;drawEditor()}
  else if(b.dataset.el){edit.list=b.dataset.el==='shared'?'shared':+b.dataset.el;drawEditor()}
  else if(b.dataset.esh!==undefined){edit.shop=b.dataset.esh;edit.addingShop=false;drawEditor()}
  else if(b.dataset.eshnew){edit.addingShop=!edit.addingShop;drawEditor()}
  else if(b.dataset.eshok){edit.shop=addShop($('e-shopnew-in').value);edit.addingShop=false;drawEditor()}
});
$('ed').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='e-shopnew-in'){e.preventDefault();edit.shop=addShop(e.target.value);edit.addingShop=false;drawEditor()}});
$('eform').addEventListener('submit',e=>{
  if(!(e.submitter&&e.submitter.value==='ok'))return;
  const it=S.items.find(i=>i.id===edit.id);if(!it)return;
  const before={...it};
  const t=$('e-text').value.trim()||it.text;it.text=t.charAt(0).toUpperCase()+t.slice(1);
  it.qty=$('e-qty').value.trim();it.note=$('e-note').value.trim();
  it.store=edit.store;it.cat=edit.cat;it.list=edit.list;it.shop=edit.store==='otras'?edit.shop:'';
  if($('e-usual').checked)remember(it,{create:true});
  else S.usual=S.usual.filter(u=>ukey(u)!==ukey(it)&&ukey(u)!==ukey(before));
  save();render();
  if(before.store!==it.store||before.list!==it.list)toast(`Movido a ${it.list==='shared'?'Compartida':'Solo mía'} · ${STORES[it.store].label}`,()=>{const x=S.items.find(i=>i.id===before.id);if(x)Object.assign(x,before)});
});
$('e-del').addEventListener('click',()=>{
  const ix=S.items.findIndex(i=>i.id===edit.id);
  if(ix>-1){const it=S.items.splice(ix,1)[0];toast(`«${it.text}» borrado`,()=>S.items.splice(ix,0,it))}
  $('ed').close();save();render();
});

/* ---------- pantalla principal ---------- */
function onClick(e){
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.store){S.store=b.dataset.store;save();render();return}
  if(b.dataset.r){openRecipe(+b.dataset.r);return}
  if(b.dataset.sf!==undefined){S.shopFilter=b.dataset.sf;save();render();return}
  if(b.id==='t-shared'||b.id==='t-mine'){S.tab=b.id==='t-shared'?'shared':'mine';if(S.tab==='shared'&&S.store==='recetas')S.store='super';save();render();return}
  const a=b.dataset.a;if(!a)return;
  if(a==='clear'){
    const gone=S.items.filter(i=>inView(i)&&i.done);
    S.items=S.items.filter(i=>!gone.includes(i));save();render();
    toast(`${gone.length} quitados`,()=>{S.items.push(...gone)});return;
  }
  const id=+b.closest('li').dataset.id,it=S.items.find(i=>i.id===id);if(!it)return;
  if(a==='edit'){openEditor(it);return}
  if(a==='tog'){it.done=!it.done;if(it.done)remember(it,{bought:true})}
  if(a==='del'){const ix=S.items.indexOf(it);S.items.splice(ix,1);toast(`«${it.text}» borrado`,()=>{S.items.splice(ix,0,it)})}
  save();render();
}
document.querySelector('main').addEventListener('click',onClick);
document.querySelector('header').addEventListener('click',onClick);
$('undo').addEventListener('click',()=>{if(last){last();last=null;save();render()}$('toast').hidden=true});
$('dform').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value==='ok'){S.names=[$('n0').value.trim()||'Yo',$('n1').value.trim()||'Pareja'];save();render()}
});

/* ---------- acceso ---------- */
addEventListener('online',render);addEventListener('offline',render);
const lerr=t=>$('lerr').textContent=t;
const MSG={'auth/invalid-credential':'Email o contraseña incorrectos.','auth/invalid-email':'Ese email no es válido.','auth/too-many-requests':'Demasiados intentos. Espera un poco.','auth/network-request-failed':'Sin conexión a internet.'};
if(!configured){
  $('lsub').textContent='Falta configurar la app: pega tus datos de Firebase en config.js.';
  $('lgo').disabled=true;
}else{
  $('lform').addEventListener('submit',async e=>{
    e.preventDefault();lerr('');$('lgo').disabled=true;$('lgo').textContent='Entrando…';
    try{await signInWithEmailAndPassword(auth,$('lemail').value.trim(),$('lpass').value)}
    catch(err){lerr(MSG[err.code]||('No se pudo entrar ('+err.code+')'))}
    $('lgo').disabled=false;$('lgo').textContent='Entrar';
  });
  $('lforgot').addEventListener('click',async()=>{
    const em=$('lemail').value.trim();if(!em){lerr('Escribe tu email arriba y vuelve a pulsar.');return}
    try{await sendPasswordResetEmail(auth,em);lerr('Te hemos enviado un email para cambiarla.')}catch(err){lerr(MSG[err.code]||err.code)}
  });
  $('logout').addEventListener('click',()=>signOut(auth));
  onAuthStateChanged(auth,user=>{
    stop();
    if(!user){uid=null;$('login').hidden=false;render();return}
    const me=MEMBERS.findIndex(m=>m.email.trim().toLowerCase()===(user.email||'').toLowerCase());
    if(me<0){lerr('Esta cuenta no está en la lista de miembros (config.js).');signOut(auth);return}
    S.me=me;uid=user.uid;
    if(S.tab==='shared'&&S.store==='recetas')S.store='super';
    $('login').hidden=true;start();render();
  });
}
render();
}
</script>
</body>
